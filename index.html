<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quest World">
<meta name="theme-color" content="#5B3FE0">
<title>Quest World</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235B3FE0'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8F%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235B3FE0'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8F%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --sky:#3FC5F0;
  --sky-deep:#1E9BCC;
  --sun:#FFC93C;
  --grass:#3FCB78;
  --coral:#FF6F59;
  --violet:#6A4CE0;
  --violet-deep:#4B32B0;
  --pink:#FF5C9D;
  --cream:#FFFBF2;
  --ink:#2C2350;
  --ink-soft:#5B5480;
  --white:#ffffff;
  --common:#9BA3AF;
  --uncommon:#3FCB78;
  --rare:#3FC5F0;
  --epic:#B26AF0;
  --legendary:#FFC93C;
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-pop: 0 8px 0 rgba(0,0,0,0.12);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
html,body{height:100%; overscroll-behavior:none;}
body{
  margin:0; font-family:'Nunito',sans-serif; background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow:hidden; position:fixed; inset:0;
}
h1,h2,h3,.display{font-family:'Baloo 2',cursive;}
button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none; touch-action:manipulation;}
input,select,textarea{font-family:inherit; -webkit-appearance:none; border-radius:var(--radius-sm); touch-action:manipulation;}
::-webkit-scrollbar{display:none;}
.screen{position:absolute; inset:0; display:none; flex-direction:column; padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); overflow:hidden;}
.screen.active{display:flex;}
.scroll{overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1;}
.hidden{display:none !important;}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:'Baloo 2',cursive; font-weight:700; font-size:17px;
  padding:14px 22px; border-radius:999px; min-height:52px;
  background:var(--violet); color:#fff; box-shadow: var(--shadow-pop);
  transition: transform .06s ease;
}
.btn:active{transform: translateY(4px); box-shadow:0 4px 0 rgba(0,0,0,0.12);}
.btn.sun{background:var(--sun); color:#5b3f00; box-shadow:0 8px 0 #c99a1a;}
.btn.grass{background:var(--grass); box-shadow:0 8px 0 #279a53;}
.btn.coral{background:var(--coral); box-shadow:0 8px 0 #cf4c3b;}
.btn.sky{background:var(--sky); box-shadow:0 8px 0 #157fa8;}
.btn.ghost{background:#fff; color:var(--violet); border:2px solid #E6E1FA; box-shadow:none;}
.btn.small{padding:8px 16px; min-height:38px; font-size:14px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.45; pointer-events:none;}

.card{background:#fff; border-radius:var(--radius-md); padding:16px; box-shadow:0 3px 0 rgba(44,35,80,0.08);}
.pill{display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px; font-weight:800; font-size:14px;}

input[type=text],input[type=password],input[type=email],input[type=number],select,textarea{
  width:100%; padding:14px 16px; font-size:16px; border:2px solid #E6E1FA; background:#fff; color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--violet); border-color:var(--violet);}
label{font-weight:800; font-size:13px; color:var(--ink-soft); display:block; margin:12px 0 6px;}

/* ============================= LOGIN ============================= */
#screen-login{background:linear-gradient(160deg,var(--violet) 0%, var(--violet-deep) 60%, #2C2350 100%); align-items:center; justify-content:center; padding:24px;}
.login-wrap{width:100%; max-width:420px; text-align:center; color:#fff;}
.login-wrap .logo{font-size:64px; margin-bottom:6px;}
.login-wrap h1{font-size:34px; margin:0 0 4px; text-shadow:0 3px 0 rgba(0,0,0,0.2);}
.login-wrap p{opacity:.85; margin:0 0 28px; font-weight:600;}
.role-cards{display:flex; gap:14px; margin-bottom:10px;}
.role-card{flex:1; background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.25); border-radius:var(--radius-lg); padding:22px 10px; color:#fff; font-family:'Baloo 2',cursive; font-weight:700; font-size:16px;}
.role-card .emoji{font-size:38px; display:block; margin-bottom:8px;}
.role-card:active{background:rgba(255,255,255,0.25);}
.auth-panel{background:#fff; border-radius:var(--radius-lg); padding:24px; margin-top:18px; text-align:left; color:var(--ink);}
.auth-panel h2{margin:0 0 4px; font-size:22px;}
.auth-panel .sub{color:var(--ink-soft); font-weight:600; font-size:14px; margin-bottom:6px;}
.link-btn{background:none; color:var(--violet); font-weight:800; text-decoration:underline; font-size:14px; padding:6px;}
.error-msg{color:var(--coral); font-weight:700; font-size:14px; margin-top:8px; min-height:18px;}
.kid-picker-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px;}
.kid-picker-item{background:#F4F1FE; border-radius:var(--radius-md); padding:14px 6px; text-align:center; border:3px solid transparent;}
.kid-picker-item .av{font-size:34px;}
.kid-picker-item .nm{font-weight:800; font-size:13px; margin-top:6px; color:var(--ink);}
.kid-picker-item:active{border-color:var(--violet);}

/* ============================= APP SHELL ============================= */
.app-shell{display:flex; flex-direction:column; height:100%;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 18px 10px; flex-shrink:0;}
.topbar .title{font-size:22px; font-weight:800;}
.stat-pill{display:flex; align-items:center; gap:6px; background:#fff; border-radius:999px; padding:6px 14px 6px 8px; font-weight:800; box-shadow:0 2px 0 rgba(44,35,80,0.08);}
.stat-pill .ic{font-size:18px;}
.hud{display:flex; gap:8px;}
.content{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px 100px;}
.tabbar{position:absolute; left:0; right:0; bottom:0; display:flex; background:#fff; box-shadow:0 -2px 12px rgba(44,35,80,0.10); padding:8px 4px calc(8px + var(--safe-bottom)); z-index:20;}
.tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; color:#B3ADCE; font-weight:800; font-size:10px; padding:6px 2px;}
.tabbar button .ic{font-size:21px;}
.tabbar button.active{color:var(--violet);}

/* xp bar */
.xp-wrap{background:#fff; border-radius:var(--radius-md); padding:14px 16px; margin:0 0 14px; box-shadow:0 3px 0 rgba(44,35,80,0.08); display:flex; align-items:center; gap:12px;}
.lvl-badge{width:52px; height:52px; border-radius:50%; background:linear-gradient(160deg,var(--sun),#F09819); display:flex; align-items:center; justify-content:center; font-family:'Baloo 2',cursive; font-weight:800; font-size:20px; color:#fff; flex-shrink:0; box-shadow:0 3px 0 #c9821a;}
.xp-track{flex:1;}
.xp-track .lbl{display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:var(--ink-soft); margin-bottom:4px;}
.xp-bar-bg{height:14px; background:#EFEBFA; border-radius:999px; overflow:hidden;}
.xp-bar-fill{height:100%; background:linear-gradient(90deg,var(--grass),#2FA85D); border-radius:999px; transition:width .5s cubic-bezier(.2,.9,.3,1);}

.section-title{font-family:'Baloo 2',cursive; font-size:19px; font-weight:700; margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
.chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px;}
.chip{flex-shrink:0; padding:9px 16px; border-radius:999px; background:#fff; font-weight:800; font-size:13px; color:var(--ink-soft); box-shadow:0 2px 0 rgba(44,35,80,0.08); border:2px solid transparent;}
.chip.active{background:var(--violet); color:#fff;}

.quest-card{display:flex; align-items:center; gap:12px; background:#fff; border-radius:var(--radius-md); padding:14px; margin-bottom:10px; box-shadow:0 3px 0 rgba(44,35,80,0.08);}
.quest-card .qic{width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0;}
.quest-card .qbody{flex:1; min-width:0;}
.quest-card .qbody .qt{font-weight:800; font-size:15px;}
.quest-card .qbody .qr{font-size:12px; color:var(--ink-soft); font-weight:700; margin-top:2px;}
.quest-card.done{opacity:.55;}

.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
.tile{background:#fff; border-radius:var(--radius-md); padding:12px 8px; text-align:center; box-shadow:0 3px 0 rgba(44,35,80,0.08); position:relative;}
.tile .em{font-size:32px; display:block;}
.tile .nm{font-weight:800; font-size:12px; margin-top:6px;}
.tile .price{font-size:11px; font-weight:800; color:var(--ink-soft); margin-top:2px;}
.tile.locked{opacity:.4;}
.rarity-dot{position:absolute; top:6px; right:6px; width:12px; height:12px; border-radius:50%; box-shadow:0 0 0 2px #fff;}
.owned-badge{position:absolute; top:6px; left:6px; background:var(--grass); color:#fff; font-size:9px; font-weight:800; padding:2px 6px; border-radius:8px;}

.progress-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.progress-row .pl{width:90px; font-size:13px; font-weight:800; flex-shrink:0;}
.progress-row .pb{flex:1; height:12px; background:#EFEBFA; border-radius:999px; overflow:hidden;}
.progress-row .pb i{display:block; height:100%; background:linear-gradient(90deg,var(--sky),var(--sky-deep));}
.progress-row .pn{width:38px; text-align:right; font-size:12px; font-weight:800; color:var(--ink-soft);}

/* island */
.island-tabs{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px;}
.island-stage{position:relative; border-radius:var(--radius-lg); height:44vh; min-height:260px; overflow:hidden; box-shadow:0 6px 0 rgba(44,35,80,0.10); margin-bottom:12px;}
.island-stage .placed{position:absolute; font-size:34px; transform:translate(-50%,-50%);}
.island-inv{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
.island-inv .item{background:#fff; border-radius:14px; padding:8px 4px; text-align:center; box-shadow:0 3px 0 rgba(44,35,80,0.08); font-size:26px;}
.island-inv .item.sel{outline:3px solid var(--violet);}

/* avatar */
.avatar-face{width:120px; height:120px; border-radius:50%; background:#F4F1FE; display:flex; align-items:center; justify-content:center; font-size:64px; margin:0 auto 14px; box-shadow:0 4px 0 rgba(44,35,80,0.1);}

/* modal / toast */
.modal-bg{position:fixed; inset:0; background:rgba(44,35,80,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px;}
.modal-bg.hidden{display:none;}
.modal-card{background:#fff; border-radius:var(--radius-lg); padding:26px; width:100%; max-width:420px; max-height:82vh; overflow-y:auto; text-align:center;}
.modal-card h2{margin-top:0;}
.toast-wrap{position:fixed; top:calc(var(--safe-top) + 10px); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:200; pointer-events:none;}
.toast{background:var(--ink); color:#fff; font-weight:800; padding:12px 20px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,0.25); font-size:14px; display:flex; align-items:center; gap:8px; animation:toastIn .35s ease, toastOut .4s ease 2.4s forwards;}
@keyframes toastIn{from{transform:translateY(-20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@keyframes toastOut{to{transform:translateY(-20px); opacity:0;}}
@keyframes pop{0%{transform:scale(0.6); opacity:0;}60%{transform:scale(1.08);}100%{transform:scale(1); opacity:1;}}
.pop-anim{animation:pop .4s cubic-bezier(.2,.9,.3,1);}
@keyframes coinfly{from{transform:translateY(0) scale(1); opacity:1;} to{transform:translateY(-60px) scale(0.4); opacity:0;}}

/* admin */
#screen-admin .content{padding-bottom:100px;}
.admin-table{width:100%; border-collapse:collapse; font-size:13px;}
.admin-table th{text-align:left; font-size:11px; color:var(--ink-soft); padding:6px 8px; border-bottom:2px solid #EFEBFA;}
.admin-table td{padding:9px 8px; border-bottom:1px solid #F4F1FE; font-weight:700;}
.form-row{display:flex; gap:10px;}
.form-row > *{flex:1;}
.family-code-box{background:linear-gradient(160deg,var(--violet),var(--violet-deep)); color:#fff; border-radius:var(--radius-lg); padding:20px; text-align:center; margin-bottom:16px;}
.family-code-box .code{font-family:'Baloo 2',cursive; font-size:34px; letter-spacing:6px; font-weight:800; margin:6px 0;}
.close-x{position:absolute; top:14px; right:14px; background:#F4F1FE; width:32px; height:32px; border-radius:50%; font-weight:800; color:var(--ink-soft); font-size:16px;}
.empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft); font-weight:700;}
.empty-state .em{font-size:44px; display:block; margin-bottom:10px;}
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<!-- ============================= LOGIN SCREEN ============================= -->
<div class="screen active" id="screen-login">
  <div class="login-wrap" id="loginHome">
    <div class="logo">🏔️</div>
    <h1>Quest World</h1>
    <p>Learn, play, and build your island!</p>
    <div class="role-cards">
      <button class="role-card" onclick="showAuthPanel('parent')"><span class="emoji">🧑‍💼</span>I'm a Grown-Up</button>
      <button class="role-card" onclick="showAuthPanel('kid')"><span class="emoji">🧒</span>I'm a Kid</button>
    </div>

    <!-- Parent auth -->
    <div class="auth-panel hidden" id="panelParent">
      <h2 id="parentPanelTitle">Grown-Up Sign In</h2>
      <div class="sub" id="parentPanelSub">Sign in to manage your family's Quest World.</div>
      <label>Email</label>
      <input type="email" id="parentEmail" placeholder="you@email.com" autocomplete="username">
      <label>Password</label>
      <input type="password" id="parentPassword" placeholder="••••••••" autocomplete="current-password">
      <div id="parentSignupExtra" class="hidden">
        <label>Family Name</label>
        <input type="text" id="familyName" placeholder="The Smith Family">
      </div>
      <button class="btn block sky" style="margin-top:16px;" id="parentSubmitBtn" onclick="parentSubmit()">Sign In</button>
      <div style="text-align:center; margin-top:10px;">
        <button class="link-btn" id="parentToggleModeBtn" onclick="toggleParentMode()">New family? Create an account</button>
      </div>
      <div class="error-msg" id="parentError"></div>
    </div>

    <!-- Kid auth -->
    <div class="auth-panel hidden" id="panelKid">
      <h2>Kid Login</h2>
      <div class="sub">Enter your Family Code to find your profile.</div>
      <label>Family Code</label>
      <input type="text" id="kidFamilyCode" placeholder="ABC123" maxlength="6" style="text-transform:uppercase; letter-spacing:3px; font-weight:800; text-align:center;">
      <button class="btn block grass" style="margin-top:14px;" onclick="loadKidPicker()">Find My Profiles</button>
      <div id="kidPickerWrap" class="hidden">
        <div class="kid-picker-grid" id="kidPickerGrid"></div>
      </div>
      <div id="kidPinWrap" class="hidden" style="margin-top:10px;">
        <label>Enter your PIN</label>
        <input type="password" id="kidPin" inputmode="numeric" maxlength="4" placeholder="••••" style="text-align:center; font-size:22px; letter-spacing:8px;">
        <button class="btn block grass" style="margin-top:12px;" onclick="kidSubmitLogin()">Let's Go!</button>
      </div>
      <div class="error-msg" id="kidError"></div>
    </div>
  </div>
</div>

<!-- ============================= KID APP ============================= -->
<div class="screen" id="screen-kid">
  <div class="app-shell">
    <div class="topbar">
      <div>
        <div style="font-size:12px; font-weight:800; color:var(--ink-soft);" id="kidGreeting">Hi!</div>
        <div class="title" id="kidNameTitle">Explorer</div>
      </div>
      <div class="hud">
        <div class="stat-pill"><span class="ic">🪙</span><span id="hudCoins">0</span></div>
      </div>
    </div>
    <div class="content" id="kidContent">
      <!-- views injected here -->
    </div>
    <div class="tabbar">
      <button class="tab-btn active" data-tab="home" onclick="kidNav('home')"><span class="ic">🏠</span>Home</button>
      <button class="tab-btn" data-tab="quests" onclick="kidNav('quests')"><span class="ic">📜</span>Quests</button>
      <button class="tab-btn" data-tab="island" onclick="kidNav('island')"><span class="ic">🏝️</span>Island</button>
      <button class="tab-btn" data-tab="pets" onclick="kidNav('pets')"><span class="ic">🐾</span>Pets</button>
      <button class="tab-btn" data-tab="collection" onclick="kidNav('collection')"><span class="ic">🗂️</span>Collect</button>
      <button class="tab-btn" data-tab="shop" onclick="kidNav('shop')"><span class="ic">🛍️</span>Shop</button>
      <button class="tab-btn" data-tab="achievements" onclick="kidNav('achievements')"><span class="ic">🏆</span>Awards</button>
      <button class="tab-btn" data-tab="profile" onclick="kidNav('profile')"><span class="ic">😊</span>Me</button>
    </div>
  </div>
</div>

<!-- ============================= ADMIN APP ============================= -->
<div class="screen" id="screen-admin">
  <div class="app-shell">
    <div class="topbar">
      <div>
        <div style="font-size:12px; font-weight:800; color:var(--ink-soft);">Quest World</div>
        <div class="title">Admin</div>
      </div>
      <button class="btn small ghost" onclick="adminSignOut()">Sign Out</button>
    </div>
    <div class="content" id="adminContent"></div>
    <div class="tabbar">
      <button class="tab-btn active" data-tab="dashboard" onclick="adminNav('dashboard')"><span class="ic">📊</span>Home</button>
      <button class="tab-btn" data-tab="children" onclick="adminNav('children')"><span class="ic">🧒</span>Kids</button>
      <button class="tab-btn" data-tab="activities" onclick="adminNav('activities')"><span class="ic">📝</span>Quests</button>
      <button class="tab-btn" data-tab="questions" onclick="adminNav('questions')"><span class="ic">❓</span>Questions</button>
      <button class="tab-btn" data-tab="events" onclick="adminNav('events')"><span class="ic">🎉</span>Events</button>
      <button class="tab-btn" data-tab="reports" onclick="adminNav('reports')"><span class="ic">📈</span>Reports</button>
      <button class="tab-btn" data-tab="settings" onclick="adminNav('settings')"><span class="ic">⚙️</span>Settings</button>
    </div>
  </div>
</div>

<!-- modal -->
<div class="modal-bg hidden" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal-card" id="modalCard"></div>
</div>

<script type="module">

const firebaseConfig = {

  authDomain: "game-quest-a765d.firebaseapp.com",

  storageBucket: "game-quest-a765d.firebasestorage.app",

  appId: "1:299028726768:web:fdf27b10771a31673c1335"
};

/* Suggested Firestore Security Rules — paste into Firebase Console > Firestore > Rules:

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isSignedIn() { return request.auth != null; }
    match /families/{familyCode} {
      allow read: if isSignedIn();
      allow create: if isSignedIn();
      allow update, delete: if isSignedIn() && resource.data.adminUid == request.auth.uid;

      }

    }
  }
}
NOTE: This app is designed for trusted family use on a shared device (like the
Quest Coins app). Kids sign in anonymously and the family code acts as the
shared secret; write access is intentionally permissive within a family's own
document tree to keep the client-only architecture simple, matching the
approach already used in Math Quest / Quest Coins.
*/

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInAnonymously,

import {

function $(id){ return document.getElementById(id); }
function xpForLevel(l){ return 50 + (l-1)*35; }
function totalXpForLevel(l){ let t=0; for(let i=1;i<l;i++) t+=xpForLevel(i); return t; }
function levelFromXp(xp){ let l=1; while(xp >= totalXpForLevel(l+1)) l++; return l; }
function genFamilyCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(msg, emoji='✨'){
  const el = document.createElement('div');
  el.className='toast pop-anim';
  el.innerHTML = `<span>${emoji}</span><span>${msg}</span>`;
  $('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(), 2900);
}
function seededRand(seed){
  let s = seed % 2147483647; if (s<=0) s += 2147483646;
  return function(){ s = s*16807 % 2147483647; return (s-1)/2147483646; };
}
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }

let pendingFamilyName = null;
let parentSubmitInFlight = false;
window.parentSubmit = async function(){
  const email = $('parentEmail').value.trim();
  const pw = $('parentPassword').value;
  const errEl = $('parentError'); errEl.textContent='';
  if(!email || !pw){ errEl.textContent='Please enter an email and password.'; return; }
  if(parentSubmitInFlight) return;
  parentSubmitInFlight = true;
  $('parentSubmitBtn').disabled = true;
  const originalLabel = $('parentSubmitBtn').textContent;
  $('parentSubmitBtn').textContent = 'Please wait…';
  try{
    if(parentMode==='signup'){
      pendingFamilyName = $('familyName').value.trim() || 'Our Family';
      await createUserWithEmailAndPassword(auth, email, pw);
      // onAuthStateChanged takes it from here (creates the family + link doc)
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
      // onAuthStateChanged takes it from here (loads or self-heals the family + link doc)
    }
  }catch(e){
    errEl.textContent = friendlyAuthError(e);
    parentSubmitInFlight = false;
    $('parentSubmitBtn').disabled = false;
    $('parentSubmitBtn').textContent = originalLabel;
  }
}
function friendlyAuthError(e){
  const c = e.code||'';
  if(c.includes('email-already-in-use')) return 'That email is already registered — try signing in instead.';
  if(c.includes('wrong-password')||c.includes('invalid-credential')) return 'Incorrect email or password.';
  if(c.includes('user-not-found')) return 'No account found with that email.';
  if(c.includes('weak-password')) return 'Password should be at least 6 characters.';
  if(c.includes('invalid-email')) return 'That email address looks invalid.';
  if(c.includes('permission-denied')) return "Couldn't save your data — make sure the Firestore security rules have been published in the Firebase console.";
  if(c.includes('network-request-failed')) return 'Network error — check your internet connection and try again.';
  return 'Something went wrong (' + (c || 'unknown error') + '). Please try again.';
}

async function getDocsCompat(colRef){
  return new Promise((resolve)=>{
    const unsub = onSnapshot(colRef, snap=>{
      unsub();
      resolve(snap.docs.map(d=>({id:d.id, data:d.data()})));
    }, ()=>resolve([]));
  });
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================================================================
   AUTH STATE OBSERVER — auto rejoin session
   =================================================================== */
onAuthStateChanged(auth, async (user)=>{
  if(!user) return;
  // Are we resuming a kid session?
  const savedCode = localStorage.getItem('qw_familyCode');
  const savedChild = localStorage.getItem('qw_childId');
  if(user.isAnonymous){
    if(savedCode && savedChild){
      enterKidMode(savedCode, savedChild);
    }
    return;
  }
  // Email/password user = admin/parent
  try{
    let linkSnap = await getDoc(doc(db,'links',user.uid));
    if(!linkSnap.exists()){
      // Self-heal: this account has no family attached yet (e.g. an earlier
      // signup that got interrupted before Firestore rules were published).
      // Create one automatically instead of leaving the person stuck.
      const code = genFamilyCode();
      const famName = pendingFamilyName || 'Our Family';
      await setDoc(doc(db,'families',code), { adminUid:user.uid, familyName:famName, createdAt: serverTimestamp() });
      await setDoc(doc(db,'links',user.uid), { familyCode:code, role:'admin' });
      pendingFamilyName = null;
      localStorage.setItem('qw_familyCode', code);
      enterAdminMode(code, user.uid);
      toast('Your family account is all set up!', '🎉');
    } else {
      localStorage.setItem('qw_familyCode', linkSnap.data().familyCode);
      enterAdminMode(linkSnap.data().familyCode, user.uid);
    }
  }catch(e){
    const errEl = $('parentError');
    if(errEl) errEl.textContent = friendlyAuthError(e);
    parentSubmitInFlight = false;
    if($('parentSubmitBtn')){ $('parentSubmitBtn').disabled=false; $('parentSubmitBtn').textContent = parentMode==='signin'?'Sign In':'Create Account'; }
  }
});

async function enterKidMode(familyCode, childId){
  clearUnsubs();
  state.mode='kid'; state.familyCode=familyCode; state.childId=childId;
  showScreen('screen-kid');
  const famSnap = await getDoc(doc(db,'families',familyCode));
  state.adminUid = famSnap.exists() ? famSnap.data().adminUid : null;

  const childRef = doc(db,'families',familyCode,'children',childId);
  const unsub1 = onSnapshot(childRef, snap=>{
    if(!snap.exists()) return;
    const prevLevel = state.child ? levelFromXp(state.child.xp||0) : null;
    state.child = snap.data();
    ensureDailyQuests(childRef, state.child);
    const newLevel = levelFromXp(state.child.xp||0);
    if(prevLevel!==null && newLevel>prevLevel){ showLevelUpModal(newLevel); }
    renderKidTopbar();
    renderKidView(currentKidTab);
  });
  state.unsubs.push(unsub1);

  const unsub2 = onSnapshot(collection(db,'families',familyCode,'activities'), snap=>{
    state.activities = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentKidTab==='quests') renderKidView('quests');
  });
  state.unsubs.push(unsub2);
  const unsub3 = onSnapshot(collection(db,'families',familyCode,'questions'), snap=>{
    state.questions = snap.docs.map(d=>({id:d.id, ...d.data()}));
  });
  state.unsubs.push(unsub3);
  const unsub4 = onSnapshot(collection(db,'families',familyCode,'events'), snap=>{
    state.events = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentKidTab==='home') renderKidView('home');
  });
  state.unsubs.push(unsub4);
}

async function ensureDailyQuests(childRef, child){
  const t = todayStr();
  if(child.dailyQuestState && child.dailyQuestState.date===t) return;
  const rnd = seededRand(hashStr((child.username||'')+t));
  const pool = [...DEFAULT_QUESTS];
  const picks = [];
  const shuffled = pool.map(q=>({q, k:rnd()})).sort((a,b)=>a.k-b.k).map(x=>x.q);
  for(let i=0;i<4 && i<shuffled.length;i++) picks.push({ ...shuffled[i], progress:0, completed:false });
  // bonus meta-goals
  picks.push({ id:'daily_coins', category:'Bonus', title:'Earn 100 Coins Today', type:'coingoal', target:100, progress:0, completed:false, coins:25, xp:15, meta:true });
  await updateDoc(childRef, { dailyQuestState:{ date:t, quests:picks } }).catch(async()=>{
    await setDoc(childRef, { dailyQuestState:{ date:t, quests:picks } }, { merge:true });
  });
  // login streak tracking
  const lastLogin = child.stats && child.stats.lastLoginDate;
  let streak = (child.stats && child.stats.loginStreak) || 0;
  if(lastLogin!==t){
    const y = new Date(Date.now()-86400000); const yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    streak = (lastLogin===yStr) ? streak+1 : 1;
    updateDoc(childRef, { 'stats.lastLoginDate': t, 'stats.loginStreak': streak }).catch(()=>{});
    checkAchievements(childRef, {...child, stats:{...(child.stats||{}), loginStreak:streak}});
  }
}

async function awardChild(deltaCoins, deltaXp, msg, emoji){
  const c = state.child;
  const childRef = doc(db,'families',state.familyCode,'children',state.childId);
  const newCoins = Math.max(0,(c.coins||0)+deltaCoins);
  const newXp = Math.max(0,(c.xp||0)+deltaXp);
  const updates = {
    coins:newCoins, xp:newXp,
    'stats.lifetimeCoins': increment(Math.max(0,deltaCoins)),
    'stats.lifetimeXp': increment(Math.max(0,deltaXp)),
  };
  await updateDoc(childRef, updates);
  if(msg) toast(msg, emoji||'🪙');
  checkAchievements(childRef, {...c, coins:newCoins, xp:newXp});
}

async function completeDailyQuest(qid){
  const c = state.child;
  const dqs = c.dailyQuestState.quests.map(q=>{
    if(q.id===qid && !q.completed){ return {...q, completed:true, progress:q.target}; }
    return q;
  });
  const q = c.dailyQuestState.quests.find(x=>x.id===qid);
  if(!q || q.completed) return;
  const childRef = doc(db,'families',state.familyCode,'children',state.childId);
  await updateDoc(childRef, {
    dailyQuestState:{ date:c.dailyQuestState.date, quests:dqs },
    coins: (c.coins||0)+q.coins, xp:(c.xp||0)+q.xp,
    'stats.questsCompleted': increment(1),
    'stats.lifetimeCoins': increment(q.coins),
    'stats.lifetimeXp': increment(q.xp),
  });
  toast(`Quest complete! +${q.coins} coins, +${q.xp} XP`, '🎉');
  checkAchievements(childRef, {...c, coins:(c.coins||0)+q.coins, xp:(c.xp||0)+q.xp, stats:{...(c.stats||{}), questsCompleted: ((c.stats&&c.stats.questsCompleted)||0)+1 }});
}

async function checkAchievements(childRef, c){
  const owned = (c.achievements)||[];
  const stats = c.stats||{};
  const level = levelFromXp(c.xp||0);
  const ownedPets = (c.inventory&&c.inventory.pets)||[];
  const ownedDecor = (c.inventory&&c.inventory.decorations)||[];
  const regions = c.unlockedRegions||['starter'];
  for(const a of ACHIEVEMENTS){
    if(owned.includes(a.id)) continue;
    let met=false;
    if(a.cond==='complete_quests') met = (stats.questsCompleted||0) >= a.target;
    if(a.cond==='own_pets') met = ownedPets.length >= a.target;
    if(a.cond==='own_decor') met = ownedDecor.length >= a.target;
    if(a.cond==='own_legendary') met = ownedPets.some(pid=>{ const p=PETS.find(x=>x.id===pid); return p && p.rarity==='legendary'; });
    if(a.cond==='unlock_region') met = regions.includes(a.target);
    if(a.cond==='reach_level') met = level >= a.target;
    if(a.cond==='login_streak') met = (stats.loginStreak||0) >= a.target;
    if(met){
      await updateDoc(childRef, {
        achievements: arrayUnion(a.id),
        coins: increment(a.coins||0), xp: increment(a.xp||0),
      });
      toast(`Achievement unlocked: ${a.name}!`, a.emoji);
    }
  }
  // region unlocks by level
  const newRegions = REGIONS.filter(r=>level>=r.level).map(r=>r.id);
  if(newRegions.length > regions.length){
    await updateDoc(childRef, { unlockedRegions:newRegions });
    const justUnlocked = newRegions.filter(r=>!regions.includes(r));
    justUnlocked.forEach(rid=>{ const r=REGIONS.find(x=>x.id===rid); toast(`New region unlocked: ${r.name}!`, r.emoji); });
  }
}

function playQuest(q, onDone){
  if(q.type==='math'){
    const rnd = Math.random;
    const a1=Math.floor(rnd()*12)+1, a2=Math.floor(rnd()*12)+1;
    const ops=['+','-','×']; const op=ops[Math.floor(rnd()*ops.length)];
    let answer = op==='+' ? a1+a2 : op==='-' ? a1-a2 : a1*a2;
    openModal(`
      <h2>➗ Quick Math!</h2>
      <div style="font-size:38px; font-weight:800; margin:20px 0;">${a1} ${op} ${a2} = ?</div>
      <input type="number" id="mathAns" style="text-align:center; font-size:24px;" placeholder="?">
      <div class="error-msg" id="mathErr"></div>
      <button class="btn block grass" style="margin-top:14px;" onclick="checkMathAns(${answer})">Submit</button>
    `);
    window.__mathDone = onDone;
  } else if(q.type==='quiz'){
    const bank = state.questions.filter(qq=>qq.category===q.category);
    if(bank.length===0){
      openModal(`<h2>${escapeHtml(q.title)}</h2><p style="font-weight:700; color:var(--ink-soft);">No custom questions yet — mark this done when you've finished with a grown-up!</p><button class="btn block grass" onclick="closeModal(); (${()=>{}})();" id="quizFallback">Mark Done</button>`);
      document.getElementById('quizFallback').onclick=()=>{ closeModal(); onDone(); };
    } else {
      const picked = bank[Math.floor(Math.random()*bank.length)];
      openModal(`
        <h2>${escapeHtml(picked.category)} Question</h2>
        <div style="font-weight:700; margin:14px 0;">${escapeHtml(picked.question)}</div>
        ${picked.choices.map((ch,i)=>`<button class="btn ghost block" style="margin-bottom:8px;" onclick="checkQuizAns(${i}, ${picked.correctIndex})">${escapeHtml(ch)}</button>`).join('')}
        <div class="error-msg" id="quizErr"></div>
      `);
      window.__quizDone = onDone;
    }
  } else if(q.type==='timer'){
    openModal(`
      <h2>📖 Reading Time</h2>
      <div style="font-weight:700; color:var(--ink-soft); margin-bottom:14px;">Read for ${q.target} minutes, then tap done!</div>
      <div style="font-size:44px;" id="timerDisp">${q.target}:00</div>
      <button class="btn block grass" style="margin-top:14px;" onclick="closeModal(); (window.__timerDone=arguments[0]||null); (${'0'})">Mark Done</button>
    `);
    const btn = document.querySelector('.modal-card .btn.grass');
    btn.onclick = ()=>{ closeModal(); onDone(); };
  } else if(q.type==='puzzle'){
    const seq=[2,4,6,8]; const ans=10;
    openModal(`
      <h2>🧩 Logic Puzzle</h2>
      <div style="font-weight:700; margin:14px 0;">What comes next? 2, 4, 6, 8, ?</div>
      <input type="number" id="puzzleAns" style="text-align:center; font-size:22px;">
      <div class="error-msg" id="puzzleErr"></div>
      <button class="btn block grass" style="margin-top:14px;" onclick="checkPuzzleAns(${ans})">Submit</button>
    `);
    window.__puzzleDone = onDone;
  } else {
    openModal(`
      <h2>${escapeHtml(q.title)}</h2>
      <div style="font-size:44px; margin:14px 0;">✅</div>
      <p style="font-weight:700; color:var(--ink-soft);">Finish this with a grown-up, then tap done!</p>
      <button class="btn block grass" onclick="closeModal(); (window.__checkoffDone)()">Mark Done</button>
    `);
    window.__checkoffDone = onDone;
  }
}
window.checkMathAns = function(correct){
  const v = parseFloat($('mathAns').value);
  if(v===correct){ closeModal(); window.__mathDone(); }
  else { $('mathErr').textContent = 'Not quite — try again!'; }
}
window.checkQuizAns = function(i, correct){
  if(i===correct){ closeModal(); window.__quizDone(); }
  else { $('quizErr').textContent = 'Not quite — try again!'; }
}
window.checkPuzzleAns = function(correct){
  const v = parseFloat($('puzzleAns').value);
  if(v===correct){ closeModal(); window.__puzzleDone(); }
  else { $('puzzleErr').textContent = 'Not quite — try again!'; }
}

window.setProfileSlot = function(s){ profileEditSlot = profileEditSlot===s?null:s; renderKidView('profile'); }
function renderSlotOptions(slot, av, ownedCosmetics){
  const opts = COSMETICS[slot];
  return `<div class="grid-3">
    ${opts.map((em,i)=>{
      const itemId = 'c_'+slot+i;
      const isFree = i===0;
      const isOwned = isFree || ownedCosmetics.includes(itemId);
      const isEquipped = av[slot]===em;
      return `<button class="tile ${isOwned?'':'locked'}" onclick="${isOwned?`equipCosmetic('${slot}','${em}')`:`openBuyModal('${itemId}','cosmetics')`}" style="${isEquipped?'outline:3px solid var(--violet);':''}">
        <span class="em">${em}</span><div class="nm">${isOwned?(isEquipped?'Equipped':'Wear'):'Locked'}</div>
      </button>`;
    }).join('')}
  </div>`;
}
window.equipCosmetic = async function(slot, emoji){
  const c = state.child;
  const av = {...(c.avatar||AVATAR_DEFAULT), [slot]: emoji};
  const childRef = doc(db,'families',state.familyCode,'children',state.childId);
  await updateDoc(childRef, { avatar: av });
  toast('Equipped!', '✨');
}
window.kidSignOut = async function(){
  localStorage.removeItem('qw_familyCode'); localStorage.removeItem('qw_childId');
  clearUnsubs(); state={mode:null, unsubs:[]};
  await signOut(auth);
  showScreen('screen-login');
  location.reload();
}

/* ===================================================================
   ADMIN MODE
   =================================================================== */
async function enterAdminMode(familyCode, adminUid){
  clearUnsubs();
  state.mode='admin'; state.familyCode=familyCode; state.adminUid=adminUid;
  showScreen('screen-admin');
  localStorage.setItem('qw_familyCode', familyCode);

  const unsubC = onSnapshot(collection(db,'families',familyCode,'children'), snap=>{
    state.children = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(['dashboard','children','reports'].includes(currentAdminTab)) renderAdminView(currentAdminTab);
  });
  state.unsubs.push(unsubC);
  const unsubA = onSnapshot(collection(db,'families',familyCode,'activities'), snap=>{
    state.activities = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentAdminTab==='activities') renderAdminView('activities');
  });
  state.unsubs.push(unsubA);
  const unsubQ = onSnapshot(collection(db,'families',familyCode,'questions'), snap=>{
    state.questions = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentAdminTab==='questions') renderAdminView('questions');
  });
  state.unsubs.push(unsubQ);
  const unsubE = onSnapshot(collection(db,'families',familyCode,'events'), snap=>{
    state.events = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentAdminTab==='events') renderAdminView('events');
  });
  state.unsubs.push(unsubE);
  renderAdminView('dashboard');
}

let currentAdminTab='dashboard';
window.adminNav = function(tab){
  currentAdminTab=tab;
  document.querySelectorAll('#screen-admin .tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  renderAdminView(tab);
}
window.adminSignOut = async function(){
  clearUnsubs(); localStorage.removeItem('qw_familyCode');
  await signOut(auth);
  showScreen('screen-login'); location.reload();
}

function renderAdminView(tab){
  const el = $('adminContent');
  if(tab==='dashboard') el.innerHTML = adminDashboard();
  else if(tab==='children') el.innerHTML = adminChildren();
  else if(tab==='activities') el.innerHTML = adminActivities();
  else if(tab==='questions') el.innerHTML = adminQuestions();
  else if(tab==='events') el.innerHTML = adminEvents();
  else if(tab==='reports') el.innerHTML = adminReports();
  else if(tab==='settings') el.innerHTML = adminSettings();
  el.scrollTop = 0;
}

function adminDashboard(){
  const kids = state.children;
  const totalCoins = kids.reduce((s,k)=>s+((k.stats&&k.stats.lifetimeCoins)||0),0);
  const totalQuests = kids.reduce((s,k)=>s+((k.stats&&k.stats.questsCompleted)||0),0);
  return `
    <div class="family-code-box">
      <div style="font-weight:700; opacity:.85;">Family Code</div>
      <div class="code">${state.familyCode}</div>
      <div style="font-size:12px; opacity:.8;">Kids enter this code to log in</div>
    </div>
    <div class="grid-2">
      <div class="card"><div style="font-size:12px; color:var(--ink-soft); font-weight:800;">Kids</div><div style="font-size:26px; font-weight:800;">${kids.length}</div></div>
      <div class="card"><div style="font-size:12px; color:var(--ink-soft); font-weight:800;">Quests Done</div><div style="font-size:26px; font-weight:800;">${totalQuests}</div></div>
      <div class="card"><div style="font-size:12px; color:var(--ink-soft); font-weight:800;">Coins Earned</div><div style="font-size:26px; font-weight:800;">${totalCoins}</div></div>
      <div class="card"><div style="font-size:12px; color:var(--ink-soft); font-weight:800;">Custom Quests</div><div style="font-size:26px; font-weight:800;">${state.activities.length}</div></div>
    </div>
    <div class="section-title">🧒 Kids Overview</div>
    ${kids.length? kids.map(k=>`
      <div class="card" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <div><div style="font-weight:800;">${escapeHtml(k.name||k.username)}</div><div style="font-size:12px; color:var(--ink-soft); font-weight:700;">Level ${levelFromXp(k.xp||0)} · 🪙 ${k.coins||0}</div></div>
      </div>`).join('') : `<div class="empty-state"><span class="em">🧒</span>No kids yet — add one in the Kids tab!</div>`}
  `;
}

function adminChildren(){
  return `
    <div class="section-title">🧒 Kid Profiles</div>
    <button class="btn grass block" onclick="openAddChildModal()">+ Add Kid Profile</button>
    <div style="margin-top:14px;">
      ${state.children.length? state.children.map(k=>`

              <div style="font-weight:800;">${escapeHtml(k.name||k.username)} <span style="font-weight:600; color:var(--ink-soft); font-size:12px;">@${escapeHtml(k.username)}</span></div>
              <div style="font-size:12px; color:var(--ink-soft); font-weight:700;">Level ${levelFromXp(k.xp||0)} · 🪙 ${k.coins||0} · PIN: ${k.pin}</div>

window.openAddChildModal = function(){
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2>Add Kid Profile</h2>
    <label>Display Name</label><input type="text" id="newChildName" placeholder="Ava">
    <label>Username</label><input type="text" id="newChildUsername" placeholder="ava">
    <label>4-Digit PIN</label><input type="password" id="newChildPin" inputmode="numeric" maxlength="4" placeholder="1234">
    <div class="error-msg" id="addChildErr"></div>
    <button class="btn block grass" style="margin-top:14px;" onclick="submitAddChild()">Create Profile</button>
  `);
}
window.submitAddChild = async function(){
  const name = $('newChildName').value.trim();
  const username = $('newChildUsername').value.trim().toLowerCase();
  const pin = $('newChildPin').value.trim();
  const err = $('addChildErr');
  if(!name||!username||pin.length<4){ err.textContent='Please fill in all fields (PIN needs 4 digits).'; return; }
  if(state.children.some(c=>c.username===username)){ err.textContent='That username is taken.'; return; }
  await addDoc(collection(db,'families',state.familyCode,'children'), {
    name, username, pin, coins:0, xp:0, avatar:AVATAR_DEFAULT,
    inventory:{pets:[],furniture:[],decorations:[],cosmetics:[]},
    achievements:[], unlockedRegions:['starter'], islandLayout:{},
    stats:{questsCompleted:0, lifetimeCoins:0, lifetimeXp:0, loginStreak:0, lastLoginDate:null},
    createdAt: serverTimestamp(),
  });
  closeModal(); toast('Kid profile created!', '🎉');
}
window.openAdjustCoinsModal = function(id){
  const k = state.children.find(c=>c.id===id);
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2>Adjust Coins — ${escapeHtml(k.name)}</h2>
    <p style="font-weight:700; color:var(--ink-soft);">Current: 🪙 ${k.coins||0}</p>
    <label>Amount (use negative to remove)</label>
    <input type="number" id="coinAdjustAmt" placeholder="e.g. 20 or -10">
    <button class="btn block sky" style="margin-top:14px;" onclick="submitAdjustCoins('${id}')">Apply</button>
  `);
}
window.submitAdjustCoins = async function(id){
  const amt = parseInt($('coinAdjustAmt').value)||0;
  const k = state.children.find(c=>c.id===id);
  await updateDoc(doc(db,'families',state.familyCode,'children',id), { coins: Math.max(0,(k.coins||0)+amt) });
  closeModal(); toast('Coins updated!', '🪙');
}
window.openGrantAchievementModal = function(id){
  const k = state.children.find(c=>c.id===id);
  const owned = k.achievements||[];
  const avail = ACHIEVEMENTS.filter(a=>!owned.includes(a.id));
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2>Grant Award — ${escapeHtml(k.name)}</h2>
    <div class="grid-3" style="margin-top:10px;">
      ${avail.map(a=>`<button class="tile" onclick="grantAchievement('${id}','${a.id}')"><span class="em">${a.emoji}</span><div class="nm">${a.name}</div></button>`).join('') || '<div class="empty-state" style="grid-column:1/-1;">All awards already earned!</div>'}
    </div>
  `);
}
window.grantAchievement = async function(childId, achId){
  const a = ACHIEVEMENTS.find(x=>x.id===achId);
  const k = state.children.find(c=>c.id===childId);
  await updateDoc(doc(db,'families',state.familyCode,'children',childId), {
    achievements: arrayUnion(achId), coins: (k.coins||0)+(a.coins||0), xp:(k.xp||0)+(a.xp||0)
  });
  closeModal(); toast('Award granted!', a.emoji);
}
window.openResetPinModal = function(id){
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2>Reset PIN</h2>
    <label>New 4-Digit PIN</label>
    <input type="password" id="resetPinVal" inputmode="numeric" maxlength="4" placeholder="1234">
    <button class="btn block sky" style="margin-top:14px;" onclick="submitResetPin('${id}')">Save</button>
  `);
}
window.submitResetPin = async function(id){
  const pin = $('resetPinVal').value.trim();
  if(pin.length<4) return;
  await updateDoc(doc(db,'families',state.familyCode,'children',id), { pin });
  closeModal(); toast('PIN reset!', '🔑');
}
window.deleteChild = async function(id){
  if(!confirm('Remove this kid profile? This cannot be undone.')) return;
  await deleteDoc(doc(db,'families',state.familyCode,'children',id));
  toast('Profile removed.', '🗑️');
}
